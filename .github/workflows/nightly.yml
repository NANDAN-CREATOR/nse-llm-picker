name: nightly-pick
on:
  schedule:
    - cron: "30 11 * * 1-5"   # 17:00 IST on weekdays, after the day's bars are final
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nightly-pick
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}   # read token; Llama is gated
      PICKER_LLM: meta-llama/Llama-3.2-1B-Instruct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.PICKER_LLM }}
      - run: pip install -r requirements.txt
      - name: Score yesterday's pick against reality
        run: python -m picker evaluate
      - name: Pick for the next session
        run: python -m picker pick
        continue-on-error: true   # e.g. data feed down; the other steps still publish
      - run: python -m picker report
      - run: python -m picker export
      - name: Commit results
        run: |
          git config user.name "picker-bot"
          git config user.email "picker-bot@users.noreply.github.com"
          git add data/predictions.db reports
          git diff --cached --quiet || git commit -m "nightly picks $(date -u +%F)"
          git push
